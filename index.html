<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Payfuture Payments Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy: #003C4E; --yellow: #FAE94E; --yellow-hover: #F2DE2E; --pale: #C0D8D7; --off: #F2F7F7; --crit: #B42318;
    --bg: var(--off); --surface: #fff; --ink: var(--navy); --muted: rgba(0,60,78,.74); --line: var(--pale); --focus: var(--navy); }
  @media (prefers-color-scheme: dark) { :root { --bg: #00222C; --surface: #003C4E; --ink: #fff; --muted: rgba(255,255,255,.72); --line: rgba(255,255,255,.14); --focus: var(--yellow); --crit: #FF9C8A; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink); font: 15px/1.6 Arial, "Helvetica Neue", sans-serif; }
  header { background: var(--navy); border-bottom: 3px solid var(--yellow); padding: 14px 20px; }
  header img { height: 28px; display: block; }
  main { display: grid; place-items: center; padding: 24px 16px; }
  form { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
  h1 { margin: 0; font: 500 22px/1.3 "Fira Sans", Arial, sans-serif; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  label { font-size: 13px; font-weight: 600; }
  input[type=password] { width: 100%; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 15px; }
  input[type=password]:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(192,216,215,.5); }
  .remember { display: flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 400; }
  .remember input { width: 16px; height: 16px; accent-color: var(--navy); }
  button { min-height: 44px; border: 0; border-radius: 10px; background: var(--yellow); color: #003C4E; font: 600 15px "Fira Sans", Arial, sans-serif; cursor: pointer; }
  button:hover { background: var(--yellow-hover); } button:disabled { opacity: .5; cursor: wait; }
  .err { color: var(--crit); font-size: 13.5px; min-height: 1.2em; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
</style>
</head>

  const KEY = 'pf-dashboard-key:' + P.salt;   // a new password (new salt) forgets old saved keys
  const bytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(key) {
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data)));
  }
  function show(html) {   // replace this page once it has loaded; earlier, the write would add to it
    const go = () => { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') go(); else addEventListener('load', go, { once: true });
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  const forget = () => { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} };
  try { for (const k of Object.keys(localStorage)) if (k.startsWith('pf-dashboard-key:') && k !== KEY) localStorage.removeItem(k); } catch (e) {}
  let saved = null; try { saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  if (saved) crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(show).catch(forget);
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; go.textContent = 'Opening…'; err.textContent = '';
    try {
      const key = await derive(document.getElementById('pw').value);
      const html = await decrypt(key);   // throws on a wrong password
      const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
      try {
        sessionStorage.setItem(KEY, raw);   // this tab only: lets the page reload after "Refresh data"
        if (document.getElementById('remember').checked) localStorage.setItem(KEY, raw);
      } catch (e) {}
      show(html);
    } catch (x) {
      err.textContent = 'That password is not right.'; go.disabled = false; go.textContent = 'Open dashboard';
    }
  });
